apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-app

  template:
    metadata:
      labels:
        app: java-app

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: java-app
          image: 621662900911.dkr.ecr.ap-south-1.amazonaws.com/java-app:IMAGE_TAG

          ports:
            - containerPort: 8080
